name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Build & Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: 'npm'

      - run: npm ci

      - run: npm run build

      - name: Create ZIP
        working-directory: plugins/saai-knowledge
        run: npx wp-scripts plugin-zip

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: plugins/saai-knowledge/*.zip
          generate_release_notes: true
