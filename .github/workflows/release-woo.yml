name: Release (WooCommerce add-on)

# Builds the add-on's (saai-knowledge-for-woocommerce) release ZIP from a
# woo-v<x.y.z> tag and keeps it, with its SHA-256, in a DRAFT GitHub Release:
# the ZIP uploaded to WooCommerce.com is always downloaded from here, so every
# upload traces back to a tag and commit.
#
# - Draft, never published: this repository is public, so a published
#   release's assets can be downloaded by anyone (and an Actions artifact by
#   anyone signed in to GitHub) — the paid add-on, built. Only users with
#   write access see drafts. The last step checks that the release is a
#   draft and that its assets' download URLs are a 404 to a client that is
#   not signed in. The write token reaches only the steps that run gh, never
#   the ones that run third-party code (npm ci's install scripts, the build).
# - release.yml's 'v*' filter does not match 'woo-v*', so the free plugin's
#   release never runs for these tags (and this one never runs for v* tags).
# - One tag per version, one ZIP per tag: a version's ZIP is never replaced.
#   The ZIP records each file's modification time, which a fresh checkout
#   and build set to the time of the run, so another run on the same commit
#   gives a different ZIP: a changed ZIP gets a new patch version instead of
#   a second ZIP for the same version. bin/verify-woo-zip.sh rejects tags with
#   anything after the version, and this workflow refuses a tag that already
#   has a release.
# - A tag on a commit that is not on main still builds (a branch can be tried
#   out before merging), but the release body then starts with a CAUTION.
on:
  push:
    tags:
      - 'woo-v*'

permissions:
  contents: write

jobs:
  release:
    name: Build & draft release
    runs-on: ubuntu-latest
    env:
      SLUG: saai-knowledge-for-woocommerce
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: 'npm'

      - run: npm ci

      - run: npm run build -w plugins/saai-knowledge-for-woocommerce

      - name: Build release ZIP
        working-directory: plugins/saai-knowledge-for-woocommerce
        run: npx wp-scripts plugin-zip

      # Contents, version agreement, and the tag naming that version; writes
      # the release body only when everything passes.
      - name: Verify release ZIP against the tag
        run: bash bin/verify-woo-zip.sh --tag "$TAG" --notes "$RUNNER_TEMP/notes.md"

      # identical / behind: the commit is main's head or one of its ancestors.
      - name: Check the tag is on main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          commit="$(git rev-parse HEAD)"
          status="$(gh api "repos/$GITHUB_REPOSITORY/compare/main...$commit" --jq .status)"
          case "$status" in
            identical | behind) ;;
            *)
              echo "::warning::$TAG is on $commit, which is not on main (compare: $status). Upload its ZIP only if that is intended."
              {
                echo "> [!CAUTION]"
                echo "> Built from $commit, which is not on main (compare: $status). Do not upload this ZIP unless that is intended."
                echo
                cat "$RUNNER_TEMP/notes.md"
              } > "$RUNNER_TEMP/notes-caution.md"
              mv "$RUNNER_TEMP/notes-caution.md" "$RUNNER_TEMP/notes.md"
              ;;
          esac

      # A tag deleted and pushed again must not get a second release next to
      # the first one's ZIP. gh release view finds drafts too.
      - name: Refuse to replace an existing release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "::error::A release for $TAG already exists. A version's ZIP is never replaced: bump the patch version and tag that instead (or delete the release and the tag by hand if it was never uploaded)."
            exit 1
          fi

      - name: Write SHA-256
        working-directory: plugins/saai-knowledge-for-woocommerce
        run: sha256sum "$SLUG.zip" > "$SLUG.zip.sha256"

      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$TAG" \
            "plugins/$SLUG/$SLUG.zip" \
            "plugins/$SLUG/$SLUG.zip.sha256" \
            --draft \
            --verify-tag \
            --title "SAAI Knowledge for WooCommerce ${TAG#woo-v}" \
            --notes-file "$RUNNER_TEMP/notes.md"

      # The asset URLs come from the release itself (a draft's are not under
      # the tag's name). curl sends no credentials, and without -L a public
      # asset answers 302 (to the storage URL) where a draft's answers 404.
      - name: Check the release is a draft and its ZIP is not public
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          draft="$(gh release view "$TAG" --json isDraft --jq .isDraft)"
          if [ "$draft" != true ]; then
            echo "::error::The release for $TAG is not a draft: anyone can download the paid add-on. Make it a draft again (or delete it) now."
            exit 1
          fi
          urls="$(gh release view "$TAG" --json assets --jq '.assets[].url')"
          if [ "$(printf '%s\n' "$urls" | grep -c .)" != 2 ]; then
            echo "::error::The draft release for $TAG should have 2 assets ($SLUG.zip and its .sha256):"
            printf '%s\n' "$urls"
            exit 1
          fi
          while read -r url; do
            code="$(curl -s -o /dev/null -w '%{http_code}' "$url")"
            if [ "$code" != 404 ]; then
              echo "::error::$url answered $code, not 404, to a client that is not signed in. Make the release a draft again (or delete it) now."
              exit 1
            fi
            echo "$url: $code"
          done <<< "$urls"
