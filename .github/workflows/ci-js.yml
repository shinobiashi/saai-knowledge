name: JS Quality

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-js:
    name: Lint JS
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: 'npm'

      - run: npm ci

      - run: npm run lint:js

  lint-css:
    name: Lint CSS
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: 'npm'

      - run: npm ci

      - run: npm run lint:css

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: 'npm'

      - run: npm ci

      - run: npm run build

      - name: Build release ZIP
        working-directory: plugins/saai-knowledge
        run: npx wp-scripts plugin-zip

      - name: Verify release ZIP contains runtime assets
        working-directory: plugins/saai-knowledge
        run: |
          CHECK_DIR="$(mktemp -d "${RUNNER_TEMP:-/tmp}/saai-knowledge-zip-check.XXXXXX")"
          unzip -q saai-knowledge.zip -d "$CHECK_DIR"
          for dir in assets build includes languages templates; do
            if [ ! -d "$CHECK_DIR/saai-knowledge/$dir" ]; then
              echo "::error::Release ZIP is missing plugins/saai-knowledge/$dir/ — check the \"files\" field in package.json (wp-scripts plugin-zip falls back to a hardcoded glob that omits assets/ and templates/ when it's absent or misconfigured)."
              exit 1
            fi
          done
          for file in saai-knowledge.php uninstall.php readme.txt; do
            if [ ! -f "$CHECK_DIR/saai-knowledge/$file" ]; then
              echo "::error::Release ZIP is missing plugins/saai-knowledge/$file"
              exit 1
            fi
          done

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: 'npm'

      - run: npm ci

      - name: Start wp-env
        run: npx wp-env start

      - run: npm run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: test-results/
          retention-days: 7
