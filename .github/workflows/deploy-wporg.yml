name: Deploy to WordPress.org

# Manual trigger only — this pushes to the live WordPress.org SVN repository
# and is NOT safe to run before the plugin has been approved there (the SVN
# credentials won't exist yet, and the deploy would fail/be rejected anyway).
# Run this from the Actions tab only after:
#   1. The plugin has been submitted and approved at
#      https://wordpress.org/plugins/developers/add/
#   2. SVN_USERNAME / SVN_PASSWORD secrets have been added to this repo
#   3. The corresponding vX.Y.Z tag/release exists — the job itself checks
#      that readme.txt's Stable tag at that tag matches the version input
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to deploy (must match an existing vX.Y.Z tag, e.g. 1.0.0)'
        required: true

permissions:
  contents: read

jobs:
  deploy:
    name: SVN Deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: v${{ github.event.inputs.version }}

      - name: Verify version matches readme.txt Stable tag
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          STABLE_TAG="$(grep -m1 '^Stable tag:' plugins/saai-knowledge/readme.txt | sed 's/^Stable tag:[[:space:]]*//')"
          if [ "$STABLE_TAG" != "$INPUT_VERSION" ]; then
            echo "::error::Input version ($INPUT_VERSION) does not match plugins/saai-knowledge/readme.txt's Stable tag ($STABLE_TAG) at tag v$INPUT_VERSION. Fix readme.txt and re-tag before deploying."
            exit 1
          fi

      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: 'npm'

      - run: npm ci

      - run: npm run build

      - name: Build release ZIP
        working-directory: plugins/saai-knowledge
        run: npx wp-scripts plugin-zip

      # BUILD_DIR must NOT point at the source directory directly: this
      # action copies BUILD_DIR's contents to SVN trunk as-is, without any
      # awareness of package.json's "files" allowlist, so plugins/saai-
      # knowledge/ itself would also ship src/, tests/, package.json, and
      # .wordpress-org/ to the public WordPress.org repository (Copilot
      # review). Deploying the already-verified release ZIP's own contents
      # instead keeps trunk identical to what ci-js.yml's "Verify release
      # ZIP contains runtime assets" step already checked.
      - name: Extract release ZIP for deploy
        run: unzip -q plugins/saai-knowledge/saai-knowledge.zip -d "$RUNNER_TEMP/wporg-deploy"

      - name: WordPress Plugin Deploy
        uses: 10up/action-wordpress-plugin-deploy@stable
        env:
          SVN_USERNAME: ${{ secrets.SVN_USERNAME }}
          SVN_PASSWORD: ${{ secrets.SVN_PASSWORD }}
          SLUG: saai-knowledge
          BUILD_DIR: ${{ runner.temp }}/wporg-deploy/saai-knowledge
          ASSETS_DIR: plugins/saai-knowledge/.wordpress-org
          VERSION: ${{ github.event.inputs.version }}
